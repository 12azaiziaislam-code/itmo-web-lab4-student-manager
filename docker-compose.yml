services:
  postgres:
    image: postgres:16-alpine
    container_name: itmo_lab4_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-students}
      POSTGRES_USER: ${POSTGRES_USER:-students_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-students_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-students_user} -d ${POSTGRES_DB:-students}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - lab4_net

  backend:
    build:
      context: ./backend
    container_name: itmo_lab4_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-students}
      DB_USERNAME: ${POSTGRES_USER:-students_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-students_pass}
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_for_lab4_please_change_it_2026}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lab4_net

  frontend:
    build:
      context: ./frontend
    container_name: itmo_lab4_frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lab4_net

volumes:
  pgdata:

networks:
  lab4_net:
    driver: bridge
